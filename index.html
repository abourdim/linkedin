<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdelhak Bourdim — Job Search Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #0a1628; color: #c8d6e5; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
  .landing { text-align: center; animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  h1 { font-size: 32px; color: #fff; margin-bottom: 4px; font-weight: 300; letter-spacing: 2px; }
  .title { font-size: 13px; color: #5ecfcf; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 36px; }
  .flags { display: flex; justify-content: center; gap: 28px; margin-bottom: 32px; }
  .flag { font-size: 42px; animation: popIn 0.4s ease-out backwards; }
  .flag:nth-child(1) { animation-delay: 0.1s; }
  .flag:nth-child(2) { animation-delay: 0.2s; }
  .flag:nth-child(3) { animation-delay: 0.3s; }
  .flag:nth-child(4) { animation-delay: 0.4s; }
  @keyframes popIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
  .bar { width: 200px; height: 3px; background: #1e3450; border-radius: 3px; margin: 0 auto; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #0a66c2, #5ecfcf); border-radius: 3px; animation: load 1.2s ease-in-out forwards; }
  @keyframes load { to { width: 100%; } }
  .enter { display: inline-block; margin-top: 24px; padding: 10px 36px; background: transparent; border: 1px solid #5ecfcf; color: #5ecfcf; border-radius: 6px; font-size: 14px; text-decoration: none; letter-spacing: 1px; opacity: 0; animation: fadeIn 0.4s ease-out 0.8s forwards; transition: background 0.2s, color 0.2s; }
  .enter:hover { background: #5ecfcf; color: #0a1628; }
</style>
</head>
<body>

<div class="landing">
  <div style="font-family:'Amiri','Scheherazade New','Traditional Arabic',serif;font-size:20px;color:#c8b06e;opacity:0.45;line-height:1.6;direction:rtl;margin-bottom:12px;">
    <span style="font-size:22px;letter-spacing:2px;">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</span><br>
    <span style="font-size:12px;opacity:0.7;font-style:italic;">﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾</span>
  </div>
  <h1>Abdelhak Bourdim</h1>
  <div class="title">Senior Embedded Software Engineer</div>
  <div class="flags">
    <span class="flag">&#127464;&#127469;</span>
    <span class="flag">&#127467;&#127479;</span>
    <span class="flag">&#127473;&#127482;</span>
    <span class="flag">&#127462;&#127466;</span>
  </div>
  <div class="bar"><div class="bar-fill"></div></div>
  <a href="jobs/index.html" class="enter">Enter</a>
</div>

</html>
